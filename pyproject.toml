[project]
name = "ic"
version = "0.1.0"
description = "Sistema de Informes de Inteligencia Competitiva — Ruta N"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.40",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-docx>=1.1",
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-postgres>=0.0.9",
  "ddgs>=0.1",
  "langchain-text-splitters>=0.3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "structlog>=24.0",
  "pypdf>=4.0",
  "matplotlib>=3.11.1",
  "spacy>=3.8.14",
  "es-core-news-md",
  "en-core-web-md",
  "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "black>=24",
  "pytest-env>=1.6.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ic"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
env = [
    "OPENBLAS_NUM_THREADS=1",
    "OMP_NUM_THREADS=1",
]
markers = [
    "slow: tests que invocan Ollama real o red externa (excluir con -m 'not slow')",
    "integration: tests E2E que requieren PostgreSQL y/o LLM real (excluir con -m 'not integration')",
]

[tool.uv.sources]
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
