[project]
name = "ic"
version = "0.1.0"
description = "Sistema de Informes de Inteligencia Competitiva — Ruta N"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.40",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "pgvector>=0.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-docx>=1.1",
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-postgres>=0.0.9",
  "ddgs>=0.1",
  "langchain-text-splitters>=0.3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "structlog>=24.0",
  "pypdf>=4.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "black>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ic"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: tests que invocan Ollama real o red externa (excluir con -m 'not slow')",
]
