# NOTA: En el entorno compartido el contenedor 'repositorio_postgres' ya ocupa el puerto
# 5434 y es la instancia que este proyecto usa (DATABASE_URL en .env apunta a él).
# Solo ejecutar 'docker compose up -d' si esa instancia NO está corriendo.
# Verificar con: docker ps | grep 5434
services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
